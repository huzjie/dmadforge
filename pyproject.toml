[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dmadforge"
version = "1.0.0"
description = "Distribution-matching adversarial distillation (DMAD) for few-step audio-video generation."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "dmadforge contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["dmadforge*"]

[project.scripts]
dmadforge = "dmadforge.cli.main:main"
