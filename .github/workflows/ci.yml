name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .
      - name: Compile check
        run: python -m compileall -q dmadforge
      - name: Run tests
        run: python -m unittest discover -s dmadforge/tests -t .
      - name: Doctor
        run: python -m dmadforge doctor
      - name: Bench
        run: python -m dmadforge bench
